<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
<style>
:root{color:#24292e;fill:currentColor}@media(prefers-color-scheme:dark){:root{color:#e6edf3}}
text{font:400 14px 'Segoe UI',Ubuntu,sans-serif}.b{font-size:18px;font-weight:600;stroke:currentColor}
@media(prefers-reduced-motion:no-preference){
.m{animation:arrive var(--t,.62s) cubic-bezier(.22,.58,.12,.98) var(--d,0s) both}
.r{--y:8px;--d:.1s}.logo{--y:4px;--d:.15s;--t:.72s}.caption{--y:5px;--d:.3s}
.pulse{animation:breathe 1.65s ease-in-out 1.15s 2}
}
@keyframes arrive{from{opacity:.62;transform:translateY(var(--y,-8px))}68%{transform:translateY(calc(var(--y,-8px)*-.16))}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{opacity:1}48%{opacity:.73}}
</style>
